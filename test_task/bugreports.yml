---
- bugreport 1: |
    При изменении названия документа или папки в разделе /documents, оно не сохраняется
  environment: |
    Google Chrome Версия 120.0.6099.225 (Официальная сборка), (64 бит)
    ОС Mindows 10 Корпоративная
  steps-to-reproduce: |
    1. Перейти по ссылке https://staging.d2twwklgqmrfet.amplifyapp.com/documents
    2. Авторизоваться через Google-аккакунт
    3. У любого документа или папки в таблице нажать кнопку "Options"
    4. Выбрать "Rename"
    5. Изменить имя выбранного доукмента или папки
    6. Щелкнуть в пустое место на странице
  expected-result: |
    Новое имя документа или папки сохранилось и отображается в талице.
  actual-result: |
   В таблице отображается имя файла (документа) такое же, как было до изменений.

- bugreport 2: |
    При попытке переместить документ в папку, не выбирая в какую именно, появляется сообщение "File sucsessfully moved", хотя файл не перемещен.
  summary: |
    Если при перемещении документ в папку не указать в какую именно, появляется сообщение "File sucsessfully moved", хотя файл не перемещен.
      environment: |
    Google Chrome Версия 120.0.6099.225 (Официальная сборка), (64 бит)
    ОС Mindows 10 Корпоративная
  steps-to-reproduce: |
    1. Перейти по ссылке https://staging.d2twwklgqmrfet.amplifyapp.com/documents
    2. Авторизоваться через Google-аккакунт
    3. У любого документа нажать кнопку "Options"
    4. Выбрать "Move to"
    5. Нажать на любую папку из списка.
    6. Нажать кнопку "Move to folder"
    7. Нажать Documents слева над таблицей
  expected-result: |
    Появилось сообщение о том, что не выбрана папка, в которую нужно переместить документ.
  actual-result: |
   Появилось сообщение "File sucsessfully moved". При этом документ никуда не перемещен.
   
- bugreport 3: |
    При добавлении документов в пустую папку в разделе /documents, иконка пустой папки не меняется на иконку полной папки.
  summary: |
    Пустая папка и папка с содержимым внутри выглядят одинаково, из-за чего непонятно, есть ли внутри документы.
  environment: |
    Google Chrome Версия 120.0.6099.225 (Официальная сборка), (64 бит)
    ОС Mindows 10 Корпоративная
  steps-to-reproduce: |
    1. Перейти по ссылке https://staging.d2twwklgqmrfet.amplifyapp.com/documents
    2. Авторизоваться через Google-аккакунт
    3. У любого документа нажать кнопку "Options"
    4. Выбрать "Move to"
    5. Нажать на любую папку из списка.
    6. Нажать кнопку "Move to folder"
    7. Нажать Documents слева над таблицей
  expected-result: |
    Появилось сообщение "File sucsessfully moved". Иконка пустой папки изменилась на иконку полной папки.
  actual-result: |
    Иконка полной папки выглядит так же, как иконка пустой папки.
    
